
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped

    env_file:
      - .env

    environment:
      NODE_ENV: production
      PORT: "5000"
      UPLOADS_DIR: /data/uploads

      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-}
      JWT_SECRET: ${JWT_SECRET:-}

      DB_HOST: ${DB_HOST:-cocolytics-database-drenvm}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_NAME: ${DB_NAME:-cocolyntiks}
      DB_SSL: ${DB_SSL:-false}

      DB_CONNECTION_LIMIT: ${DB_CONNECTION_LIMIT:-10}
      DB_QUEUE_LIMIT: ${DB_QUEUE_LIMIT:-50}

    expose:
      - "5000"

    volumes:
      - cocolytics_uploads:/data

    networks:
      - cocolytics-network

volumes:
  cocolytics_uploads:

networks:
  cocolytics-network:
    external: true
    name: cocolytics-network
