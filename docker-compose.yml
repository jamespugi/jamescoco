services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "5000"
      UPLOADS_DIR: /data/uploads
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-}
      JWT_SECRET: ${JWT_SECRET:-}
      DB_HOST: ${DB_HOST:-${MYSQLHOST:-${MYSQL_HOST:-cocolytics-database-drenvm}}}
      DB_PORT: ${DB_PORT:-${MYSQLPORT:-${MYSQL_PORT:-3306}}}
      DB_USER: ${DB_USER:-${MYSQLUSER:-${MYSQL_USER:-root}}}
      DB_PASSWORD: ${DB_PASSWORD:-${MYSQLPASSWORD:-${MYSQL_PASSWORD:-}}}
      DB_ALLOW_EMPTY_PASSWORD: ${DB_ALLOW_EMPTY_PASSWORD:-false}
      DB_NAME: ${DB_NAME:-${MYSQLDATABASE:-${MYSQL_DATABASE:-cocolyntiks}}}
      DATABASE_URL: ${DATABASE_URL:-${MYSQL_URL:-}}
      DB_SSL: ${DB_SSL:-false}
    networks:
      - default
      - database
    expose:
      - "5000"
    volumes:
      - cocolytics_uploads:/data

volumes:
  cocolytics_uploads:

networks:
  default: {}
  database:
    name: cocolytics-network
    external: true
