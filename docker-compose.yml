services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "5000"
      UPLOADS_DIR: /data/uploads
    expose:
      - "5000"
    volumes:
      - cocolytics_uploads:/data

volumes:
  cocolytics_uploads:
