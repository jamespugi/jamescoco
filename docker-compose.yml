services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "5000"
      UPLOADS_DIR: /data/uploads
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-}
      JWT_SECRET: ${JWT_SECRET:-}
      DB_HOST: ${DB_HOST:-${MYSQLHOST:-${MYSQL_HOST:-}}}
      DB_PORT: ${DB_PORT:-${MYSQLPORT:-${MYSQL_PORT:-}}}
      DB_USER: ${DB_USER:-${MYSQLUSER:-${MYSQL_USER:-}}}
      DB_PASSWORD: ${DB_PASSWORD:-${MYSQLPASSWORD:-${MYSQL_PASSWORD:-}}}
      DB_NAME: ${DB_NAME:-${MYSQLDATABASE:-${MYSQL_DATABASE:-}}}
      DATABASE_URL: ${DATABASE_URL:-${MYSQL_URL:-}}
      DB_SSL: ${DB_SSL:-false}
    expose:
      - "5000"
    volumes:
      - cocolytics_uploads:/data

volumes:
  cocolytics_uploads:
