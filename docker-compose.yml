services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "5000"
      UPLOADS_DIR: /data/uploads
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:?Set CLIENT_ORIGIN to the public HTTPS app URL}
      JWT_SECRET: ${JWT_SECRET:?Set a strong JWT_SECRET}
      DB_HOST: ${DB_HOST:?Set DB_HOST to the external MySQL hostname}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:?Set DB_NAME}
      DB_USER: ${DB_USER:?Set DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      DB_SSL: ${DB_SSL:-false}
      DB_CONNECTION_LIMIT: ${DB_CONNECTION_LIMIT:-10}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      PAYMONGO_SECRET_KEY: ${PAYMONGO_SECRET_KEY:-}
      PAYMONGO_API_URL: ${PAYMONGO_API_URL:-https://api.paymongo.com}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-COCOLYTICS}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      TWILIO_MESSAGING_SERVICE_SID: ${TWILIO_MESSAGING_SERVICE_SID:-}
    expose:
      - "5000"
    volumes:
      - cocolytics_uploads:/data

volumes:
  cocolytics_uploads:
